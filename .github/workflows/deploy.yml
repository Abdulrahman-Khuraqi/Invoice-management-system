name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          missing=0
          for v in FTP_SERVER FTP_USERNAME FTP_PASSWORD DB_NAME DB_USER DB_PASS; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret: $v"; missing=1; fi
          done
          case "$FTP_SERVER" in
            ftp://*|*/*) echo "::error::FTP_SERVER must be only the host, e.g. 82.198.230.29 (no ftp:// and no folder)"; missing=1;;
          esac
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Check PHP syntax
        run: find api -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Assemble site
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          mkdir deploy
          cp -r web/dist/. deploy/
          cp -r api deploy/api
          rm -f deploy/api/config.php deploy/api/config.example.php
          # Database settings come from repository secrets; var_export escapes them safely.
          php -r '
            $cfg = [
              "db_host" => getenv("DB_HOST") ?: "localhost",
              "db_port" => 3306,
              "db_name" => getenv("DB_NAME"),
              "db_user" => getenv("DB_USER"),
              "db_pass" => getenv("DB_PASS"),
              "debug"   => false,
            ];
            file_put_contents("deploy/api/config.php", "<?php\nreturn " . var_export($cfg, true) . ";\n");
          '

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./deploy/
          # The FTP account u122068939.ms already starts in public_html/ms
          server-dir: ./
