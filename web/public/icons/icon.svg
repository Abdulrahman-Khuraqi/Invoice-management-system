    <rect x="180" y="262" width="78" height="12" rx="6"/><rect x="300" y="262" width="32" height="12" rx="6" fill="#bfdbfe"/>
    <rect x="180" y="296" width="108" height="12" rx="6"/><rect x="300" y="296" width="32" height="12" rx="6" fill="#bfdbfe"/>
